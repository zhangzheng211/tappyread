<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📖 点读绘本 · 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: #FFF9F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255,215,150,0.20) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255,200,120,0.15) 0%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,220,160,0.05) 40px, rgba(255,220,160,0.05) 80px);
        }

        /* ===== 登录卡片（卡通风格，与点读绘本同款） ===== */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #FFFAF0;
            border-radius: 48px 48px 32px 32px;
            border: 4px solid #F0D5B0;
            box-shadow: 0 12px 0 #E8D5B5, 0 20px 40px rgba(0,0,0,0.10);
            padding: 36px 32px 40px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,215,150,0.25) 0%, transparent 60%),
                repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(255,220,160,0.04) 30px, rgba(255,220,160,0.04) 60px);
        }
        /* 圆点装饰边框 */
        .login-card::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 20px;
            right: 20px;
            height: 12px;
            background: repeating-conic-gradient(#FFB882 0% 25%, transparent 0% 50%) 0 0 / 16px 12px;
            border-radius: 40px 40px 0 0;
            opacity: 0.5;
        }

        .login-card .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-card .logo-area .icon-big {
            font-size: 56px;
            display: block;
            line-height: 1;
        }
        .login-card .logo-area h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 32px;
            font-weight: 800;
            color: #5D3A1A;
            margin-top: 4px;
            letter-spacing: 1px;
            text-shadow: 3px 3px 0 #F0D5B0;
        }
        .login-card .logo-area .sub {
            font-size: 14px;
            font-weight: 700;
            color: #8A7A6A;
            background: rgba(255,215,150,0.25);
            display: inline-block;
            padding: 2px 20px;
            border-radius: 40px;
            border: 2px dashed #DBA87A;
            margin-top: 2px;
        }

        .login-card .field {
            margin-bottom: 18px;
        }
        .login-card .field label {
            display: block;
            font-weight: 800;
            font-size: 15px;
            color: #5D3A1A;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .login-card .field label .emoji {
            margin-right: 6px;
        }
        .login-card .field input {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #2B2440;
            background: #FFFCF5;
            border: 3px solid #ECCBAE;
            border-radius: 30px;
            outline: none;
            transition: all 0.15s ease;
            box-shadow: inset 0 2px 6px rgba(200,150,100,0.06);
        }
        .login-card .field input:focus {
            border-color: #4D7A9C;
            box-shadow: 0 0 0 4px rgba(77, 122, 156, 0.12), inset 0 2px 6px rgba(200,150,100,0.06);
        }
        .login-card .field input::placeholder {
            color: #B8A898;
            font-weight: 400;
        }

        .login-card .login-btn {
            width: 100%;
            padding: 14px 20px;
            font-family: 'Baloo 2', cursive;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            background: #4D7A9C;
            border: 3px solid #2A5A7A;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1A3A5A;
            transition: all 0.08s linear;
            margin-top: 6px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-card .login-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1A3A5A;
        }
        .login-card .login-btn:hover {
            background: #5A8AAC;
        }

        .login-card .error-msg {
            color: #C0392B;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            min-height: 24px;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(192, 57, 43, 0.06);
            border: 2px solid rgba(192, 57, 43, 0.10);
            display: none;
        }
        .login-card .error-msg.show {
            display: block;
        }

        .login-card .footer-note {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #B08868;
            margin-top: 16px;
            border-top: 2px dashed #E8D5B5;
            padding-top: 14px;
            letter-spacing: 0.5px;
        }
        .login-card .footer-note span {
            display: inline-block;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* 响应式 */
        @media (max-width: 500px) {
            .login-card {
                padding: 28px 20px 32px;
                border-radius: 36px 36px 24px 24px;
            }
            .login-card .logo-area h1 {
                font-size: 26px;
            }
            .login-card .logo-area .icon-big {
                font-size: 44px;
            }
            .login-card .field input {
                padding: 10px 14px;
                font-size: 15px;
            }
            .login-card .login-btn {
                font-size: 18px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 登录卡片 ===== -->
    <div class="login-card" id="loginCard">
        <!-- 圆点装饰由伪元素生成 -->

        <div class="logo-area">
            <span class="icon-big">📖</span>
            <h1>tappyread</h1>
            <h1>点读机</h1>
            <div class="sub">✨ 精读版 · 登录 ✨</div>
        </div>

        <!-- 用户名 -->
        <div class="field">
            <label><span class="emoji">👤</span> 用户名</label>
            <input type="text" id="usernameInput" placeholder="请输入用户名" autocomplete="username">
        </div>

        <!-- 密码 -->
        <div class="field">
            <label><span class="emoji">🔒</span> 密码</label>
            <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="current-password">
        </div>

        <!-- 错误提示 -->
        <div class="error-msg" id="errorMsg">❌ 用户名或密码错误，请重试</div>

        <!-- 登录按钮 -->
        <button class="login-btn" id="loginBtn">🔓 登 录</button>

        <div class="footer-note">
            <span>🌟</span> 用自己拥有的图片，一分钟制作一本点读书 <span>🌟</span>
        </div>
    </div>

    <script>
        (function() {
            // ===== DOM 引用 =====
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            // ===== 固定内置用户 (仅 admin / admin!) =====
            const VALID_USERNAME = 'admin';
            const VALID_PASSWORD = 'admin!';

            // ===== 登录验证 =====
            function handleLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // 清除旧错误
                errorMsg.classList.remove('show');
                errorMsg.style.color = '#C0392B';
                errorMsg.style.background = 'rgba(192, 57, 43, 0.06)';
                errorMsg.style.borderColor = 'rgba(192, 57, 43, 0.10)';

                // 基本校验
                if (!username) {
                    errorMsg.textContent = '⚠️ 请输入用户名';
                    errorMsg.classList.add('show');
                    usernameInput.focus();
                    return;
                }
                if (!password) {
                    errorMsg.textContent = '⚠️ 请输入密码';
                    errorMsg.classList.add('show');
                    passwordInput.focus();
                    return;
                }

                // 固定用户验证
                if (username !== VALID_USERNAME || password !== VALID_PASSWORD) {
                    errorMsg.textContent = '❌ 用户名或密码错误，请重试';
                    errorMsg.classList.add('show');
                    passwordInput.focus();
                    passwordInput.select();
                    return;
                }

                // ===== 登录成功 =====
                errorMsg.classList.remove('show');

                const btn = loginBtn;
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ 登录成功，跳转中...';
                btn.style.background = '#3E8E5A';
                btn.style.borderColor = '#245c37';
                btn.style.boxShadow = '0 6px 0 #1c4a2c';
                btn.disabled = true;

                // 1.5秒后跳转
                setTimeout(() => {
                    window.location.href = 'showfirst.html';
                }, 1500);

                // 备用：如果 3 秒后还在当前页，提示用户手动跳转
                setTimeout(() => {
                    if (!window.location.href.includes('tappyread')) {
                        btn.innerHTML = '🔓 点击手动跳转';
                        btn.style.background = '#4D7A9C';
                        btn.style.borderColor = '#2A5A7A';
                        btn.style.boxShadow = '0 6px 0 #1A3A5A';
                        btn.disabled = false;
                        btn.onclick = function() {
                            window.location.href = 'showfirst.html';
                        };
                        errorMsg.textContent = '✅ 登录验证通过！点击按钮手动跳转至首页';
                        errorMsg.style.color = '#2A7A4A';
                        errorMsg.style.background = 'rgba(62, 142, 90, 0.08)';
                        errorMsg.style.borderColor = 'rgba(62, 142, 90, 0.20)';
                        errorMsg.classList.add('show');
                    }
                }, 3000);
            }

            // ===== 事件绑定 =====
            loginBtn.addEventListener('click', handleLogin);

            // 回车键触发登录
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    passwordInput.focus();
                }
            });
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleLogin();
                }
            });

            // ===== 控制台提示（调试用，前端不显示用户信息） =====
            console.log('🔐 内置管理员账户: admin / admin!');
        })();
    </script>

</body>
</html>

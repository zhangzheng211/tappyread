<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 PDF 转图片工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            background: #f5f0eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fffcf7;
            border-radius: 32px;
            padding: 40px 44px 48px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.04);
            border: 1px solid #eee5dc;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #3d2c1e;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #8a7a6a;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px dashed #e8ddd0;
        }
        .drop-zone {
            border: 3px dashed #d4c5b5;
            border-radius: 24px;
            padding: 48px 24px;
            text-align: center;
            background: #faf7f2;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .drop-zone:hover {
            border-color: #b8a392;
            background: #f8f3ec;
        }
        .drop-zone.dragover {
            border-color: #7a9fbf;
            background: #f0f5fa;
        }
        .drop-zone .icon {
            font-size: 52px;
            display: block;
            margin-bottom: 10px;
        }
        .drop-zone .main-text {
            font-size: 18px;
            font-weight: 600;
            color: #3d2c1e;
        }
        .drop-zone .hint {
            font-size: 14px;
            color: #9a8a7a;
            margin-top: 6px;
        }
        .drop-zone .or {
            font-size: 13px;
            color: #b0a090;
            margin: 12px 0 8px;
        }
        .drop-zone .file-input-wrap {
            display: inline-block;
            position: relative;
        }
        .drop-zone .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            background: #dacfc1;
            color: #3d2c1e;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-primary {
            background: #7a9fbf;
            color: #fff;
            box-shadow: 0 4px 0 #4a6f8f;
        }
        .btn-primary:hover {
            background: #8ab0d0;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #4a6f8f;
        }
        .btn-secondary {
            background: #e8ddd0;
            color: #4d3d2d;
        }
        .btn-secondary:hover {
            background: #ddd0c0;
        }
        .btn-danger {
            background: #d4a090;
            color: #fff;
            box-shadow: 0 4px 0 #a07060;
        }
        .btn-danger:hover {
            background: #e0b0a0;
        }
        .btn-danger:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #a07060;
        }

        .file-list {
            margin-top: 24px;
            border-radius: 20px;
            background: #faf7f2;
            padding: 12px 16px;
            border: 1px solid #e8ddd0;
        }
        .file-list .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #5d4d3d;
            padding: 4px 4px 10px 4px;
            border-bottom: 1px solid #e8ddd0;
        }
        .file-list .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid #f0e8e0;
            font-size: 14px;
        }
        .file-list .file-item:last-child {
            border-bottom: none;
        }
        .file-list .file-name {
            font-weight: 500;
            color: #3d2c1e;
            word-break: break-word;
            flex: 1;
            margin-right: 12px;
        }
        .file-list .file-size {
            color: #8a7a6a;
            font-size: 13px;
            white-space: nowrap;
            margin-right: 12px;
        }
        .file-list .file-status {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-done { color: #5a8a6a; }
        .status-processing { color: #c09040; }
        .status-error { color: #c06050; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            align-items: center;
        }
        .controls .btn {
            flex: 0 0 auto;
        }
        .controls .spacer {
            flex: 1;
        }
        .controls .info-text {
            font-size: 13px;
            color: #8a7a6a;
        }

        .log-area {
            margin-top: 20px;
            background: #2d241c;
            border-radius: 16px;
            padding: 14px 18px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #d4d0c8;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
            display: none;
        }
        .log-area.show {
            display: block;
        }
        .log-area .log-line {
            border-bottom: 1px solid #3d342c;
            padding: 2px 0;
        }
        .log-area .log-line:last-child {
            border-bottom: none;
        }
        .log-area .log-time {
            color: #8a7a6a;
            margin-right: 12px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 13px;
            color: #b0a090;
            text-align: center;
            border-top: 1px solid #eee5dc;
            padding-top: 18px;
        }
        .footer-note code {
            background: #f0ece6;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #5d4d3d;
        }

        @media (max-width: 600px) {
            .container { padding: 24px 18px 32px; }
            h1 { font-size: 22px; }
            .drop-zone { padding: 32px 16px; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls .btn { justify-content: center; }
            .file-list .file-item { flex-wrap: wrap; gap: 4px; }
            .file-list .file-size { margin-right: 4px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 PDF 转图片</h1>
    <div class="subtitle">将 PDF 每一页转换为高清 JPG 图片 · 完全在本地运行</div>

    <!-- 拖拽区 -->
    <div class="drop-zone" id="dropZone">
        <span class="icon">📂</span>
        <div class="main-text">拖拽 PDF 文件到此处</div>
        <div class="hint">支持 .pdf 格式，可一次选择多个文件</div>
        <div class="or">— 或 —</div>
        <div class="file-input-wrap">
            <button class="btn btn-primary" id="selectBtn">选择 PDF 文件</button>
            <input type="file" id="fileInput" accept=".pdf" multiple>
        </div>
    </div>

    <!-- 文件列表 -->
    <div class="file-list" id="fileList">
        <div class="header">
            <span>📋 已选文件</span>
            <span id="fileCount">0 个</span>
        </div>
        <div id="fileItems">
            <!-- 动态渲染 -->
            <div style="text-align:center; color:#b0a090; padding:16px 0; font-size:14px;" id="emptyHint">暂无文件，请添加 PDF</div>
        </div>
    </div>

    <!-- 控制栏 -->
    <div class="controls">
        <button class="btn btn-primary" id="convertBtn">🔄 开始转换</button>
        <button class="btn btn-secondary" id="clearBtn">🗑️ 清空列表</button>
        <button class="btn btn-secondary" id="toggleLogBtn">📋 显示日志</button>
        <span class="spacer"></span>
        <span class="info-text" id="statusText">就绪</span>
    </div>

    <!-- 日志 -->
    <div class="log-area" id="logArea"></div>

    <div class="footer-note">
        ⚡ 基于 PDF.js · 所有转换在浏览器本地完成，文件不上传服务器 &nbsp;·&nbsp; 转换后自动下载 ZIP 包
    </div>
</div>

<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
</script>
<!-- JSZip CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
</script>
<!-- FileSaver CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
</script>

<script>
    (function() {
        // ---------- 配置 ----------
        const WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_SRC;

        // ---------- 状态 ----------
        let fileQueue = [];          // 存储 { name, file, status, pages? }
        let isConverting = false;
        let logLines = [];

        // DOM 引用
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');
        const fileItemsEl = document.getElementById('fileItems');
        const fileCountEl = document.getElementById('fileCount');
        const emptyHint = document.getElementById('emptyHint');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const toggleLogBtn = document.getElementById('toggleLogBtn');
        const logArea = document.getElementById('logArea');
        const statusText = document.getElementById('statusText');

        // ---------- 辅助函数 ----------
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        // 清理文件名：去除开头数字+横杠，下划线转空格，与shell脚本逻辑一致
        function cleanFileName(raw) {
            // 去掉 .pdf 后缀
            let name = raw.replace(/\.pdf$/i, '');
            // 去掉开头第一组数字 + 横杠 (如 "123-")
            let step1 = name.replace(/^[0-9]+-/, '');
            // 下划线转空格
            let step2 = step1.replace(/_/g, ' ');
            // 去除首尾空格
            let result = step2.trim();
            if (!result) result = 'book';
            return result;
        }

        // ---------- 渲染文件列表 ----------
        function renderFileList() {
            const items = fileQueue;
            let html = '';
            if (items.length === 0) {
                html = `<div style="text-align:center; color:#b0a090; padding:16px 0; font-size:14px;">暂无文件，请添加 PDF</div>`;
                fileItemsEl.innerHTML = html;
                fileCountEl.textContent = '0 个';
                return;
            }

            items.forEach((item, index) => {
                let statusClass = 'status-processing';
                let statusText = '⏳ 待处理';
                if (item.status === 'done') {
                    statusClass = 'status-done';
                    statusText = `✅ ${item.pages || 0} 页`;
                } else if (item.status === 'processing') {
                    statusClass = 'status-processing';
                    statusText = '🔄 转换中...';
                } else if (item.status === 'error') {
                    statusClass = 'status-error';
                    statusText = '❌ 失败';
                }
                html += `
                    <div class="file-item">
                        <span class="file-name">📄 ${item.name}</span>
                        <span class="file-size">${formatFileSize(item.file.size)}</span>
                        <span class="file-status ${statusClass}">${statusText}</span>
                    </div>
                `;
            });
            fileItemsEl.innerHTML = html;
            fileCountEl.textContent = items.length + ' 个';
        }

        // ---------- 添加文件 ----------
        function addFiles(files) {
            let added = 0;
            for (const file of files) {
                // 只允许 PDF
                if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                    addLog('⚠️ 跳过非PDF文件: ' + file.name);
                    continue;
                }
                // 检查是否已经存在
                const exists = fileQueue.some(item => item.name === file.name && item.file.size === file.size);
                if (exists) {
                    addLog('⏭️ 文件已存在，跳过: ' + file.name);
                    continue;
                }
                fileQueue.push({
                    name: file.name,
                    file: file,
                    status: 'pending',  // pending, processing, done, error
                    pages: null
                });
                added++;
            }
            if (added > 0) {
                addLog(`📎 添加了 ${added} 个 PDF 文件`);
                renderFileList();
                updateStatus(`已添加 ${fileQueue.length} 个文件`);
            } else {
                addLog('⚠️ 没有新文件被添加');
            }
        }

        // ---------- 日志 ----------
        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logLines.push(`[${time}] ${msg}`);
            if (logArea.classList.contains('show')) {
                renderLog();
            }
        }

        function renderLog() {
            logArea.innerHTML = logLines.map(line =>
                `<div class="log-line">${line}</div>`
            ).join('');
            logArea.scrollTop = logArea.scrollHeight;
        }

        function toggleLog() {
            logArea.classList.toggle('show');
            if (logArea.classList.contains('show')) {
                renderLog();
                toggleLogBtn.textContent = '📋 隐藏日志';
            } else {
                toggleLogBtn.textContent = '📋 显示日志';
            }
        }

        function updateStatus(msg) {
            statusText.textContent = msg;
        }

        // ---------- 核心：PDF 转图片 ----------
        async function convertPdfToImages(file, cleanName) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const totalPages = pdf.numPages;
            const images = [];

            for (let i = 1; i <= totalPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.5 }); // 较高分辨率
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;

                // 转为 JPEG (质量 0.92)
                const imageData = canvas.toDataURL('image/jpeg', 0.92);
                // 去掉 data:image/jpeg;base64, 前缀
                const base64Data = imageData.split(',')[1];
                const byteString = atob(base64Data);
                const byteArray = new Uint8Array(byteString.length);
                for (let j = 0; j < byteString.length; j++) {
                    byteArray[j] = byteString.charCodeAt(j);
                }
                // 页面编号：从1开始，用空格分隔
                const pageNum = i;
                images.push({
                    blob: new Blob([byteArray], { type: 'image/jpeg' }),
                    filename: `${cleanName} ${pageNum}.jpg`
                });
            }

            return images;
        }

        // ---------- 执行转换 ----------
        async function startConversion() {
            if (isConverting) return;
            if (fileQueue.length === 0) {
                addLog('⚠️ 没有文件可转换');
                updateStatus('没有文件');
                return;
            }

            // 检查是否有待处理或失败的文件
            const pendingItems = fileQueue.filter(item => item.status === 'pending' || item.status === 'error');
            if (pendingItems.length === 0) {
                addLog('✅ 所有文件已转换完成');
                updateStatus('已完成');
                return;
            }

            isConverting = true;
            convertBtn.disabled = true;
            convertBtn.textContent = '⏳ 转换中...';
            updateStatus(`转换中 (0/${pendingItems.length})...`);

            let convertedCount = 0;
            let totalImages = 0;
            const zip = new JSZip();

            for (let idx = 0; idx < fileQueue.length; idx++) {
                const item = fileQueue[idx];
                if (item.status === 'done') continue; // 跳过已完成的

                // 只处理 pending 或 error
                if (item.status !== 'pending' && item.status !== 'error') continue;

                item.status = 'processing';
                renderFileList();
                addLog(`🔄 转换: ${item.name}`);

                try {
                    const cleanName = cleanFileName(item.name);
                    const images = await convertPdfToImages(item.file, cleanName);
                    item.status = 'done';
                    item.pages = images.length;
                    totalImages += images.length;

                    // 添加到 ZIP
                    for (const img of images) {
                        zip.file(img.filename, img.blob);
                    }

                    convertedCount++;
                    addLog(`✅ ${item.name} → ${images.length} 页`);
                    updateStatus(`转换中 (${convertedCount}/${pendingItems.length}) ...`);
                } catch (err) {
                    item.status = 'error';
                    addLog(`❌ ${item.name} 转换失败: ${err.message}`);
                    console.error(err);
                }

                renderFileList();
            }

            // 检查是否有任何成功转换的图片
            let zipBlob = null;
            let hasImages = false;
            for (const item of fileQueue) {
                if (item.status === 'done' && item.pages > 0) {
                    hasImages = true;
                    break;
                }
            }

            if (hasImages) {
                try {
                    zipBlob = await zip.generateAsync({ type: 'blob' });
                    const now = new Date();
                    const timestamp =
                        `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                    const zipName = `PDF转图片_${timestamp}.zip`;
                    saveAs(zipBlob, zipName);
                    addLog(`📦 下载 ZIP: ${zipName} (共 ${totalImages} 张图片)`);
                    updateStatus(`✅ 完成！下载 ${zipName}`);
                } catch (err) {
                    addLog(`❌ 打包 ZIP 失败: ${err.message}`);
                    updateStatus('打包失败');
                }
            } else {
                addLog('⚠️ 没有成功转换的图片，不生成 ZIP');
                updateStatus('没有成功转换的图片');
            }

            isConverting = false;
            convertBtn.disabled = false;
            convertBtn.textContent = '🔄 开始转换';
            renderFileList();

            // 如果全部完成
            const allDone = fileQueue.every(item => item.status === 'done' || item.status === 'error');
            if (allDone) {
                updateStatus('全部处理完成');
                addLog('🏁 全部处理完成');
            }
        }

        // ---------- 清空 ----------
        function clearAll() {
            if (isConverting) return;
            if (fileQueue.length === 0) return;
            if (!confirm('确定要清空所有文件吗？')) return;
            fileQueue = [];
            renderFileList();
            addLog('🗑️ 已清空文件列表');
            updateStatus('已清空');
        }

        // ---------- 事件绑定 ----------
        // 选择文件
        selectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                addFiles(this.files);
                this.value = '';
            }
        });

        // 拖拽
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                addFiles(e.dataTransfer.files);
            }
        });

        // 点击拖拽区触发文件选择
        dropZone.addEventListener('click', (e) => {
            if (e.target === dropZone || e.target.closest('.drop-zone') && !e.target.closest('.file-input-wrap')) {
                fileInput.click();
            }
        });

        // 转换
        convertBtn.addEventListener('click', startConversion);

        // 清空
        clearBtn.addEventListener('click', clearAll);

        // 日志切换
        toggleLogBtn.addEventListener('click', toggleLog);

        // 初始化
        renderFileList();
        addLog('🚀 工具已加载，支持拖拽或选择 PDF 文件');
        updateStatus('就绪');

        // 添加上下文: 如果有命令行参数(通过某种方式) 但浏览器不支持, 忽略
        console.log('📄 PDF转图片工具已加载 (基于PDF.js + JSZip)');
        console.log('💡 拖拽PDF或点击选择文件, 转换后自动下载ZIP');
    })();
</script>
</body>
</html>
